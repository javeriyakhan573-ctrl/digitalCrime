<!DOCTYPE html>
<html>
<head>
    <title>Case Details - E-Crime BioMatch</title>

    <script>
        // Check login before loading the page
        const loggedIn = localStorage.getItem("loggedIn");

        if (loggedIn !== "true") {
            window.location.href = "/login.html";
        }
    </script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        .header {
            background-color: #1f2937;
            color: white;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            display: flex;
            min-height: calc(100vh - 70px);
        }

        .sidebar {
            width: 220px;
            background-color: #111827;
            padding-top: 20px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            font-size: 16px;
        }

        .sidebar a:hover {
            background-color: #374151;
        }

        .main {
            flex: 1;
            padding: 30px;
        }

        h1 {
            margin-top: 0;
        }

        .case-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 800px;
        }

        .case-card p {
            font-size: 16px;
            margin: 12px 0;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 12px 18px;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .biometric-btn {
            background-color: #2563eb;
        }

        .biometric-btn:hover {
            background-color: #1d4ed8;
        }

        .face-btn {
            background-color: #16a34a;
        }

        .face-btn:hover {
            background-color: #15803d;
        }

        .evidence-btn {
            background-color: #9333ea;
        }

        .evidence-btn:hover {
            background-color: #7e22ce;
        }

        .back-btn {
            background-color: #6b7280;
        }

        .back-btn:hover {
            background-color: #4b5563;
        }

        .error {
            color: #dc2626;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        E-Crime Biometric System
    </div>

    <div class="container">

        <!-- SIDEBAR -->
        <div class="sidebar">

            <a href="/dashboard.html">Dashboard</a>

            <a href="/cases.html">Cases</a>

            <a href="/create-case.html">Create Case</a>

            <a href="/biomatch.html">Biometric Search</a>

            <a href="/home.html">Home</a>

        </div>

        <!-- MAIN CONTENT -->
        <div class="main">

            <h1>Case Details</h1>

            <div id="caseDetails">
                Loading case details...
            </div>

        </div>

    </div>

    <script>

        const params = new URLSearchParams(window.location.search);

        const caseId = params.get("id");

        const caseDetails = document.getElementById("caseDetails");

        if (!caseId) {

            caseDetails.innerHTML =
                "<p class='error'>No case ID provided.</p>";

        } else {

            fetch("/api/cases/" + encodeURIComponent(caseId))

                .then(response => {

                    if (!response.ok) {
                        throw new Error("Case not found");
                    }

                    return response.json();

                })

                .then(caseData => {

                    caseDetails.innerHTML = `

                        <div class="case-card">

                            <p>
                                <strong>Case ID:</strong>
                                ${caseData.case_id}
                            </p>

                            <p>
                                <strong>Case Number:</strong>
                                ${caseData.case_number || ""}
                            </p>

                            <p>
                                <strong>Case Title:</strong>
                                ${caseData.case_title || ""}
                            </p>

                            <p>
                                <strong>Crime Type:</strong>
                                ${caseData.crime_type || ""}
                            </p>

                            <p>
                                <strong>Case Date:</strong>
                                ${caseData.case_date || ""}
                            </p>

                            <p>
                                <strong>Location:</strong>
                                ${caseData.location || ""}
                            </p>

                            <p>
                                <strong>Description:</strong>
                                ${caseData.description || ""}
                            </p>

                            <p>
                                <strong>Status:</strong>
                                ${caseData.status || ""}
                            </p>

                            <div class="buttons">

                                <a
                                    href="/cases.html"
                                    class="btn back-btn"
                                >
                                    ← Back to Cases
                                </a>

                                <a
                                    href="/biometric-data.html?case_id=${encodeURIComponent(caseId)}"
                                    class="btn biometric-btn"
                                >
                                    🧬 Biometric Data
                                </a>

                                <a
                                    href="/biomatch.html?case_id=${encodeURIComponent(caseId)}"
                                    class="btn face-btn"
                                >
                                    👤 Face Match
                                </a>

                                <a
                                    href="/evidence.html?case_id=${encodeURIComponent(caseId)}"
                                    class="btn evidence-btn"
                                >
                                    📁 Evidence
                                </a>

                            </div>

                        </div>

                    `;

                })

                .catch(error => {

                    console.error(error);

                    caseDetails.innerHTML =
                        "<p class='error'>" +
                        "Failed to load case details." +
                        "</p>";

                });

        }

    </script>

</body>
</html>
