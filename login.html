```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - E-Crime BioMatch Engine</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #1f2937;
        }

        .login-box p {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #374151;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            color: #dc2626;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>E-Crime BioMatch</h1>

        <p>Login to your account</p>

        <form id="loginForm">

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <label for="role">Role</label>
            <select id="role">
                <option value="admin">Admin</option>
                <option value="officer">Officer</option>
            </select>

            <button type="submit">Login</button>

            <div class="message" id="message"></div>

        </form>

    </div>

    <script>

        document.getElementById("loginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const role = document.getElementById("role").value;

            /*
             Temporary login for POC testing.
             Replace this later with database/backend authentication.
            */

            if (username === "admin" && password === "admin123") {

                // Save login status
                localStorage.setItem("loggedIn", "true");

                // Save username and role for later use
                localStorage.setItem("username", username);
                localStorage.setItem("role", role);

                window.location.href = "/home.html";

            } else {

                document.getElementById("message").textContent =
                    "Invalid username or password.";

            }

        });

    </script>

</body>
</html>
