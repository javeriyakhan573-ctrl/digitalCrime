
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Crime BioMatch - Live Face Match</title>

    <script src="/node_modules/@vladmandic/face-api/dist/face-api.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f6fa;
            color: #1f2937;
        }

        h1 { margin-bottom: 5px; }

        .box {
            margin-top: 20px;
            padding: 25px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            max-width: 900px;
        }

        button {
            padding: 12px 22px;
            margin: 10px 5px 10px 0;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            font-size: 15px;
        }

        button.stop { background: #dc2626; }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        video {
            width: 500px;
            max-width: 100%;
            border-radius: 10px;
            margin-top: 15px;
            background: black;
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            font-weight: bold;
        }

        #result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            background: #f1f5f9;
            overflow-wrap: anywhere;
        }

        #registeredPhoto {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 10px;
        }

        .match {
            font-size: 22px;
            font-weight: bold;
        }

        .distance { margin-top: 10px; }

        .record {
            background: #fff;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 15px;
            margin: 12px 0;
        }

        .record h4 { margin-top: 0; }

        .record p {
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        .evidencePhoto {
            display: block;
            max-width: 260px;
            max-height: 220px;
            object-fit: contain;
            margin-top: 12px;
            border-radius: 6px;
        }

        .muted { color: #64748b; }
    </style>
</head>

<body>
    <h1>E-Crime BioMatch</h1>
    <p>Live Face Recognition POC</p>

    <div class="box">
        <h2>Live Face Test</h2>
        <p>Start the camera and look directly at the camera.</p>

        <button id="startCamera">📷 Start Camera</button>
        <button id="stopCamera" class="stop" disabled>⛔ Stop Camera</button>
        <br>

        <video id="video" autoplay muted playsinline></video>
    </div>

    <div id="status">Loading face-recognition models...</div>

    <div class="box">
        <h2>Face Match Result</h2>
        <div id="result">Camera not started yet.</div>
    </div>

    <script>
        // ==========================================
        // VARIABLES
        // ==========================================

        let modelsLoaded = false;
        let cameraStream = null;
        let matchingInterval = null;
        let registeredPeople = [];
        let isCheckingFace = false;
        let currentMatchedPersonId = null;

        const MODEL_URL = "/models";
        const MATCH_THRESHOLD = 0.60;

        // ==========================================
        // ELEMENTS
        // ==========================================

        const video = document.getElementById("video");
        const status = document.getElementById("status");
        const result = document.getElementById("result");
        const startCameraButton = document.getElementById("startCamera");
        const stopCameraButton = document.getElementById("stopCamera");

        // ==========================================
        // LOAD FACE MODELS
        // ==========================================

        async function loadModels() {
            try {
                status.textContent = "Loading face-recognition models...";

                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

                modelsLoaded = true;
                status.textContent = "✅ Face-recognition models loaded successfully.";

                await loadRegisteredPeople();
            } catch (error) {
                console.error(error);
                status.textContent = "❌ Could not load face-recognition models.";
            }
        }

        // ==========================================
        // LOAD REGISTERED PEOPLE
        // ==========================================

        async function loadRegisteredPeople() {
            try {
                const response = await fetch("/api/face-registry");

                if (!response.ok) {
                    throw new Error("Could not load registered profiles.");
                }

                const data = await response.json();

                registeredPeople = Array.isArray(data)
                    ? data
                    : (Array.isArray(data.profiles) ? data.profiles : []);

                console.log("Registered people:", registeredPeople);

                if (registeredPeople.length === 0) {
                    result.innerHTML = "⚠️ No registered face profiles found.";
                    return;
                }

                result.innerHTML =
                    "✅ " + registeredPeople.length +
                    " registered face profile(s) ready for matching.";
            } catch (error) {
                console.error(error);
                status.textContent = "❌ Could not load registered profiles.";
            }
        }

        // ==========================================
        // START CAMERA
        // ==========================================

        startCameraButton.addEventListener("click", async function () {
            if (!modelsLoaded) {
                status.textContent = "Please wait for the models to load.";
                return;
            }

            if (registeredPeople.length === 0) {
                status.textContent = "❌ No registered person is available.";
                return;
            }

            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" },
                    audio: false
                });

                video.srcObject = cameraStream;

                startCameraButton.disabled = true;
                stopCameraButton.disabled = false;

                currentMatchedPersonId = null;
                status.textContent = "📷 Camera started. Looking for a face...";
                result.innerHTML = "Look directly at the camera.";

                matchingInterval = setInterval(checkLiveFace, 1000);
            } catch (error) {
                console.error(error);
                status.textContent = "❌ Could not access camera.";
                result.innerHTML = "Please allow camera permission in Safari.";
            }
        });

        // ==========================================
        // STOP CAMERA
        // ==========================================

        stopCameraButton.addEventListener("click", stopCamera);

        function stopCamera() {
            if (matchingInterval) {
                clearInterval(matchingInterval);
                matchingInterval = null;
            }

            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }

            video.srcObject = null;
            startCameraButton.disabled = false;
            stopCameraButton.disabled = true;
            currentMatchedPersonId = null;

            status.textContent = "Camera stopped.";
            result.innerHTML = "Camera is currently stopped.";
        }

        // ==========================================
        // CHECK LIVE FACE
        // ==========================================

        async function checkLiveFace() {
            if (isCheckingFace || !video.videoWidth || !video.videoHeight) {
                return;
            }

            isCheckingFace = true;

            try {
                const detection = await faceapi
                    .detectSingleFace(
                        video,
                        new faceapi.TinyFaceDetectorOptions({
                            inputSize: 320,
                            scoreThreshold: 0.5
                        })
                    )
                    .withFaceLandmarks()
                    .withFaceDescriptor();

                if (!detection) {
                    currentMatchedPersonId = null;
                    status.textContent = "🔎 Looking for a face...";
                    result.innerHTML =
                        "No face detected. Please look at the camera.";
                    return;
                }

                status.textContent = "🔍 Face detected. Comparing...";

                const liveDescriptor = detection.descriptor;
                let bestPerson = null;
                let bestDistance = Infinity;

                // Compare the live face with registered descriptors.
                for (const person of registeredPeople) {
                    if (!person.face_descriptor) continue;

                    let storedDescriptor;

                    try {
                        storedDescriptor =
                            typeof person.face_descriptor === "string"
                                ? JSON.parse(person.face_descriptor)
                                : person.face_descriptor;
                    } catch (error) {
                        console.error(
                            "Invalid stored descriptor:",
                            person.person_name
                        );
                        continue;
                    }

                    if (
                        !Array.isArray(storedDescriptor) ||
                        storedDescriptor.length !== liveDescriptor.length ||
                        !storedDescriptor.every(Number.isFinite)
                    ) {
                        continue;
                    }

                    const distance = faceapi.euclideanDistance(
                        liveDescriptor,
                        storedDescriptor
                    );

                    console.log(person.person_name, "distance:", distance);

                    if (distance < bestDistance) {
                        bestDistance = distance;
                        bestPerson = person;
                    }
                }

                if (!bestPerson) {
                    currentMatchedPersonId = null;
                    status.textContent = "❌ No usable registered face.";
                    result.innerHTML =
                        "No valid registered face descriptors were found.";
                    return;
                }

                if (bestDistance <= MATCH_THRESHOLD) {
                    status.textContent = "✅ Face match found!";

                    const personId = String(bestPerson.person_id);

                    // Avoid repeatedly fetching the same person's records.
                    if (currentMatchedPersonId !== personId) {
                        currentMatchedPersonId = personId;

                        result.innerHTML =
                            "<div class='match'>✅ MATCH FOUND</div>" +
                            "<h3>Name: " + escapeHtml(bestPerson.person_name) + "</h3>" +
                            "<p><strong>Profile ID:</strong> " +
                            escapeHtml(personId) + "</p>" +
                            "<p class='distance'><strong>Face Distance:</strong> " +
                            bestDistance.toFixed(4) + "</p>" +
                            "<p>Preliminary face match. Please verify the records independently.</p>" +
                            profilePhotoHtml(bestPerson) +
                            
                           "<hr><h3>Linked Cases and Evidence</h3>";

                        await loadMatchedCaseEvidence(personId);
                    } else {
                        // Update the distance without reloading case records.
                        const distanceElement = result.querySelector("#faceDistance");

                        if (distanceElement) {
                            distanceElement.textContent = bestDistance.toFixed(4);
                        }
                    }
                } else {
                    currentMatchedPersonId = null;
                    status.textContent = "❌ No matching registered face.";

                    result.innerHTML =
                        "<div class='match'>❌ NO MATCH</div>" +
                        "<p>Closest registered profile: <strong>" +
                        escapeHtml(bestPerson.person_name) + "</strong></p>" +
                        "<p class='distance'><strong>Face Distance:</strong> " +
                        bestDistance.toFixed(4) + "</p>" +
                        "<p>No profile passed the configured threshold.</p>";
                }
            } catch (error) {
                console.error(error);
                status.textContent = "❌ Face matching error.";
            } finally {
                isCheckingFace = false;
            }
        }

        // ==========================================
        // REGISTERED PHOTO
        // ==========================================

        function profilePhotoHtml(person) {
            if (!person.photo_path) return "";

            return "<img id='registeredPhoto' src='" +
                escapeHtml(person.photo_path) +
                "' alt='Registered profile photo'>";
        }

        // ==========================================
        // LOAD LINKED CASES AND EVIDENCE
        // ==========================================

        async function loadMatchedCaseEvidence(personId) {
            let cases = [];
            let evidence = [];
            const errors = [];

            try {
                const response = await fetch(
                    "/api/face-registry/" + encodeURIComponent(personId) + "/cases"
                );

                if (!response.ok) throw new Error("Could not load linked cases.");

                const data = await response.json();
                cases = Array.isArray(data.cases) ? data.cases : [];
            } catch (error) {
                console.error(error);
                errors.push("Could not load linked cases.");
            }

            try {
                const response = await fetch(
                    "/api/face-registry/" + encodeURIComponent(personId) + "/evidence"
                );

                if (!response.ok) throw new Error("Could not load linked evidence.");

                const data = await response.json();
                evidence = Array.isArray(data.evidence) ? data.evidence : [];
            } catch (error) {
                console.error(error);
                errors.push("Could not load linked evidence.");
            }

            // The user may have stopped the camera or another profile may match.
            if (currentMatchedPersonId !== String(personId)) return;

            let html = "<hr><h3>Linked Cases</h3>";

            if (cases.length === 0) {
                html += "<p>No linked cases were returned for this profile.</p>";
            } else {
                for (const item of cases) {
                    html +=
                        "<div class='record'>" +
                        "<h4>" + escapeHtml(item.case_number || "Case") + "</h4>" +
                        "<p><strong>Case ID:</strong> " +
                        escapeHtml(item.case_id) + "</p>" +
                        "<p><strong>Title:</strong> " +
                        escapeHtml(item.case_title || "Not provided") + "</p>" +
                        "<p><strong>Crime type:</strong> " +
                        escapeHtml(item.crime_type || "Not provided") + "</p>" +
                        "<p><strong>Location:</strong> " +
                        escapeHtml(item.location || "Not provided") + "</p>" +
                        "<p><strong>Status:</strong> " +
                        escapeHtml(item.status || "Not provided") + "</p>" +
                        "</div>";
                }
            }

            html += "<hr><h3>Linked Evidence</h3>";

            if (evidence.length === 0) {
                html += "<p>No evidence records were returned for this profile.</p>";
            } else {
                for (const item of evidence) {
                    html +=
                        "<div class='record'>" +
                        "<h4>" + escapeHtml(item.evidence_name || "Evidence") + "</h4>" +
                        "<p><strong>Evidence ID:</strong> " +
                        escapeHtml(item.evidence_id) + "</p>" +
                        "<p><strong>Case:</strong> " +
                        escapeHtml(item.case_number || "Not provided") +
                        " (ID: " + escapeHtml(item.case_id) + ")</p>" +
                        "<p><strong>Type:</strong> " +
                        escapeHtml(item.evidence_type || "Not provided") + "</p>" +
                        "<p><strong>Description:</strong> " +
                        escapeHtml(item.description || "No description provided") + "</p>" +
                        "<p><strong>Evidence date:</strong> " +
                        escapeHtml(formatDate(item.evidence_date)) + "</p>";

                    if (item.file_path) {
                        const fileUrl = normaliseFilePath(item.file_path);

                        html +=
                            "<p><strong>File path:</strong> " +
                            "<a href='" + escapeHtml(fileUrl) +
                            "' target='_blank' rel='noopener noreferrer'>Open evidence file</a></p>";

                        if (/\.(png|jpe?g|webp|gif)$/i.test(fileUrl)) {
                            html +=
                                "<img class='evidencePhoto' src='" +
                                escapeHtml(fileUrl) +
                                "' alt='Evidence preview' loading='lazy' " +
                                "onerror='this.style.display=\"none\"'>";
                        }
                    } else {
                        html += "<p>No evidence file path is available.</p>";
                    }

                    html += "</div>";
                }
            }

            if (errors.length > 0) {
                html += "<p class='muted'>" +
                    errors.map(escapeHtml).join("<br>") + "</p>";
            }

            html +=
                "<p class='muted'>Face matching is a preliminary result and must not be treated as proof of identity or criminal involvement.</p>";

                console.log("Linked cases:", cases);
console.log("Linked evidence:", evidence);
result.innerHTML += html;
        }

        // ==========================================
        // HELPERS
        // ==========================================

        function normaliseFilePath(filePath) {
            const path = String(filePath || "").trim();

            // Keep application-relative paths on this server.
            if (path.startsWith("/")) return path;
            return "/" + path;
        }

        function formatDate(value) {
            if (!value) return "Not provided";

            const date = new Date(value);

            if (Number.isNaN(date.getTime())) {
                return String(value);
            }

            return date.toLocaleDateString();
        }

        function escapeHtml(value) {
            const div = document.createElement("div");
            div.textContent = value == null ? "" : String(value);
            return div.innerHTML;
        }

        // ==========================================
        // START
        // ==========================================

        loadModels();
    </script>
</body>
</html>
