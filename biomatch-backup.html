<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BioMatch - Face Recognition</title>

    <script src="/node_modules/@vladmandic/face-api/dist/face-api.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .box {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        img {
            max-width: 300px;
            max-height: 250px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>E-Crime BioMatch</h1>
    <p>Face Recognition POC</p>

    <div class="box">

        <h3>Reference Photograph</h3>

        <input
            type="file"
            id="referenceImage"
            accept="image/*"
        >

        <br>

        <img id="referencePreview" alt="Reference preview">

    </div>

    <div class="box">

        <h3>Comparison Photograph</h3>

        <input
            type="file"
            id="comparisonImage"
            accept="image/*"
        >

        <br>

        <img id="comparisonPreview" alt="Comparison preview">

    </div>

    <br>

    <button id="compareButton">
        Compare Faces
    </button>

    <div id="status">
        Loading face-recognition models...
    </div>

    <div id="result">
        No comparison performed yet.
    </div>

    <script>

        let modelsLoaded = false;

        const MODEL_URL = "/models";

        // Load the required face-recognition models
        async function loadModels() {

            try {

                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);

                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);

                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

                modelsLoaded = true;

                document.getElementById("status").textContent =
                    "Face-recognition models loaded successfully.";

            } catch (error) {

                console.error(error);

                document.getElementById("status").textContent =
                    "Failed to load face-recognition models.";

            }
        }


        // Preview reference image
        document.getElementById("referenceImage")
            .addEventListener("change", function () {

                const file = this.files[0];

                if (!file) return;

                document.getElementById("referencePreview").src =
                    URL.createObjectURL(file);
            });


        // Preview comparison image
        document.getElementById("comparisonImage")
            .addEventListener("change", function () {

                const file = this.files[0];

                if (!file) return;

                document.getElementById("comparisonPreview").src =
                    URL.createObjectURL(file);
            });


        // Convert selected file into an image element
        function loadImage(file) {

            return new Promise((resolve, reject) => {

                const image = new Image();

                image.onload = () => resolve(image);

                image.onerror = reject;

                image.src = URL.createObjectURL(file);

            });
        }


        // Compare faces
        document.getElementById("compareButton")
            .addEventListener("click", async function () {

                const referenceFile =
                    document.getElementById("referenceImage").files[0];

                const comparisonFile =
                    document.getElementById("comparisonImage").files[0];

                const result =
                    document.getElementById("result");

                if (!modelsLoaded) {

                    result.textContent =
                        "Please wait for the models to finish loading.";

                    return;
                }

                if (!referenceFile || !comparisonFile) {

                    result.textContent =
                        "Please select both photographs.";

                    return;
                }

                result.textContent =
                    "Analyzing the photographs...";

                try {

                    const referenceImage =
                        await loadImage(referenceFile);

                    const comparisonImage =
                        await loadImage(comparisonFile);


                    // Detect reference face and create descriptor
                    const referenceDetection =
                        await faceapi
                            .detectSingleFace(
                                referenceImage,
                                new faceapi.TinyFaceDetectorOptions()
                            )
                            .withFaceLandmarks()
                            .withFaceDescriptor();


                    // Detect comparison face and create descriptor
                    const comparisonDetection =
                        await faceapi
                            .detectSingleFace(
                                comparisonImage,
                                new faceapi.TinyFaceDetectorOptions()
                            )
                            .withFaceLandmarks()
                            .withFaceDescriptor();


                    if (!referenceDetection) {

                        result.textContent =
                            "No face detected in the reference photograph.";

                        return;
                    }


                    if (!comparisonDetection) {

                        result.textContent =
                            "No face detected in the comparison photograph.";

                        return;
                    }


                    // Calculate Euclidean distance
                    const distance =
                        faceapi.euclideanDistance(
                            referenceDetection.descriptor,
                            comparisonDetection.descriptor
                        );


                    // Demo threshold
                    const threshold = 0.6;

                    const isMatch =
                        distance <= threshold;


                    // Convert distance into a simple demo score
                    let similarity =
                        Math.max(
                            0,
                            Math.min(
                                100,
                                (1 - distance) * 100
                            )
                        );

                    similarity =
                        similarity.toFixed(2);


                    if (isMatch) {

                        result.innerHTML =
                            "✅ MATCH<br>" +
                            "Similarity Score: " +
                            similarity +
                            "%<br>" +
                            "Distance: " +
                            distance.toFixed(4);

                    } else {

                        result.innerHTML =
                            "❌ NO MATCH<br>" +
                            "Similarity Score: " +
                            similarity +
                            "%<br>" +
                            "Distance: " +
                            distance.toFixed(4);

                    }

                } catch (error) {

                    console.error(error);

                    result.textContent =
                        "Face comparison failed. Check the browser console for details.";

                }

            });


        // Start loading models
        loadModels();

    </script>

</body>
</html>
