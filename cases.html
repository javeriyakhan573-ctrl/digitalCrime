<body>

    <div class="header">
        E-Crime Biometric System
    </div>

    <div class="container">

        <div class="sidebar">
            <a href="/dashboard.html">Dashboard</a>
            <a href="/cases.html">Cases</a>
            <a href="/create-case.html">Create Case</a>
            <a href="/biomatch.html">Biometric Search</a>
            <a href="/home.html">Home</a>
        </div>

        <div class="main">

            <div class="top-bar">
                <div>
                    <h1>Cases</h1>
                    <p>Cases registered in the E-Crime BioMatch system.</p>
                </div>

                <a href="/create-case.html" class="create-btn">
                    + Create New Case
                </a>
            </div>

            <div id="message" class="message" role="status"></div>

            <table>
                <thead>
                    <tr>
                        <th>Case ID</th>
                        <th>Case Number</th>
                        <th>Case Title</th>
                        <th>Crime Type</th>
                        <th>Case Date</th>
                        <th>Location</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="casesTable">
                    <tr>
                        <td colspan="8">Loading cases...</td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>

    <script>
        const table = document.getElementById("casesTable");
        const message = document.getElementById("message");

        async function loadCases() {
            table.innerHTML =
                "<tr><td colspan='8'>Loading cases...</td></tr>";

            try {
                const response = await fetch("/api/cases");

                if (!response.ok) {
                    throw new Error("Failed to fetch cases.");
                }

                const data = await response.json();

                const cases = Array.isArray(data)
                    ? data
                    : (data.cases || []);

                table.innerHTML = "";

                if (cases.length === 0) {
                    table.innerHTML =
                        "<tr><td colspan='8'>No cases found.</td></tr>";
                    return;
                }

                cases.forEach(caseItem => {
                    const row = document.createElement("tr");

                    const values = [
                        caseItem.case_id,
                        caseItem.case_number || "",
                        caseItem.case_title || "",
                        caseItem.crime_type || "",
                        caseItem.case_date
                            ? String(caseItem.case_date).slice(0, 10)
                            : "",
                        caseItem.location || "",
                        caseItem.status || ""
                    ];

                    values.forEach(value => {
                        const cell = document.createElement("td");
                        cell.textContent = value;
                        row.appendChild(cell);
                    });

                    const actionCell = document.createElement("td");
                    const actions = document.createElement("div");
                    actions.className = "actions";

                    const viewButton = document.createElement("a");
                    viewButton.href =
                        "/case-details.html?id=" +
                        encodeURIComponent(caseItem.case_id);
                    viewButton.className = "view-btn";
                    viewButton.textContent = "View Details";

                    const deleteButton = document.createElement("button");
                    deleteButton.type = "button";
                    deleteButton.className = "delete-btn";
                    deleteButton.textContent = "Delete";

                    deleteButton.addEventListener("click", () => {
                        deleteCase(caseItem.case_id, deleteButton);
                    });

                    actions.appendChild(viewButton);
                    actions.appendChild(deleteButton);
                    actionCell.appendChild(actions);
                    row.appendChild(actionCell);
                    table.appendChild(row);
                });

            } catch (error) {
                console.error("Load cases error:", error);

                table.innerHTML =
                    "<tr><td colspan='8' class='error'>" +
                    "Failed to load cases. Check that the server is running." +
                    "</td></tr>";
            }
        }

        async function deleteCase(caseId, button) {
            const confirmed = confirm(
                "Are you sure you want to delete case ID " +
                caseId +
                "?\n\nThis action may affect related records."
            );

            if (!confirmed) {
                return;
            }

            button.disabled = true;
            button.textContent = "Deleting...";
            message.textContent = "";
            message.className = "message";

            try {
                const response = await fetch(
                    "/api/cases/" + encodeURIComponent(caseId),
                    {
                        method: "DELETE"
                    }
                );

                const result = await response.json().catch(() => ({}));

                if (!response.ok || result.success === false) {
                    throw new Error(
                        result.message ||
                        "Could not delete the case. Check the server route and related records."
                    );
                }

                message.textContent =
                    result.message || "Case deleted successfully.";
                message.className = "message success";

                await loadCases();

            } catch (error) {
                console.error("Delete case error:", error);

                message.textContent =
                    error.message || "An error occurred while deleting the case.";
                message.className = "message error";

                button.disabled = false;
                button.textContent = "Delete";
            }
        }

        loadCases();
    </script>

</body>
</html>
